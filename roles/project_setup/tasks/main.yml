---
- name: Clone repo
  become: false
  git:
    repo: "{{ project_repo_url }}"
    dest: "{{ project_root }}"
    version: main
    update: yes

- name: Ensure pip is up to date in micromamba env
  become: false
  ansible.builtin.pip:
    name: pip
    state: latest
    executable: "{{ mamba_root_prefix }}/envs/{{ mamba_env_name }}/bin/pip"

- name: Install Python dependencies with pip in micromamba env
  become: false
  ansible.builtin.pip:
    requirements: "{{ project_root }}/requirements.txt"
    executable: "{{ mamba_root_prefix }}/envs/{{ mamba_env_name }}/bin/pip"
