---
- name: Try mirrors until apt update succeeds
  include_tasks: try_mirror.yml
  loop: "{{ ubuntu_mirrors }}"
  loop_control:
    loop_var: current_mirror
  when: 
    - not (skip_apt_update | default(false) | bool)
    - apt_update_result is not defined or apt_update_result.failed

- name: Install base packages
  become: true
  apt:
    name: "{{ system_packages }}"
    state: present
    update_cache: no

- name: Add NVIDIA graphics drivers PPA
  become: true
  ansible.builtin.apt_repository:
    repo: ppa:graphics-drivers/ppa
    state: present
    update_cache: "{{ not (skip_apt_update | default(false) | bool) }}"
  when: install_nvidia | default(true) | bool

- name: Determine the highest available NVIDIA driver version
  become: true
  shell: "ubuntu-drivers devices | grep -oP 'nvidia-driver-\\d+' | sort -rV | head -n 1"
  register: latest_driver
  changed_when: false
  when: install_nvidia | default(true) | bool

- name: Explicitly install the highest NVIDIA driver
  become: true
  apt:
    name: "{{ latest_driver.stdout }}"
    state: present
  register: driver_install
  changed_when:
    - "'already installed' not in driver_install.stdout"
    - "'No drivers found' not in driver_install.stdout"
  when: install_nvidia | default(true) | bool

- name: Ensure /dataset is owned by the current user and their primary group
  become: true
  file:
    path: /dataset
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    recurse: yes
    state: directory